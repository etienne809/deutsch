<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand, danke! Learn German to A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F1; --surface:#FFFFFF; --sunk:#E6ECE7; --ink:#15211C; --ink-2:#48574F; --ink-3:#74847C; --line:#D3DCD5;
  --accent:#F4C430; --accent-soft:#FBEDB5; --accent-ink:#2B2200; --hl:#F4C430;
  --der:#2257C5; --die:#C92A48; --das:#12855A; --pl:#66736C;
  --ok:#137344; --ok-bg:#DFF3E7; --bad:#B3261E; --bad-bg:#FBE4E1; --almost:#8F5300; --almost-bg:#FFEFD1;
  --m0:#7A4FCF; --m1:#D27400; --m2:#0B8797; --m3:#BF3589; --m4:#5A7A1C; --m5:#8A5A3B;
  --r-l:22px; --r:14px; --r-s:10px;
  --font-body:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512; --surface:#18211D; --sunk:#222D28; --ink:#E8EFEA; --ink-2:#A9BAB1; --ink-3:#7D8F86; --line:#2E3B35;
    --accent:#F4C430; --accent-soft:#3B3212; --accent-ink:#2B2200; --hl:rgba(244,196,48,.38);
    --der:#7FA7FF; --die:#FF7D92; --das:#4FD39B; --pl:#9AA9A1;
    --ok:#5ED49A; --ok-bg:#15352A; --bad:#FF8A7E; --bad-bg:#3D1C19; --almost:#FFB74D; --almost-bg:#3A2A10;
    --m0:#A98BFF; --m1:#FFA94D; --m2:#4CC9D9; --m3:#FF7FC8; --m4:#A6CF5A; --m5:#D1A07E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512; --surface:#18211D; --sunk:#222D28; --ink:#E8EFEA; --ink-2:#A9BAB1; --ink-3:#7D8F86; --line:#2E3B35;
  --accent:#F4C430; --accent-soft:#3B3212; --accent-ink:#2B2200; --hl:rgba(244,196,48,.38);
  --der:#7FA7FF; --die:#FF7D92; --das:#4FD39B; --pl:#9AA9A1;
  --ok:#5ED49A; --ok-bg:#15352A; --bad:#FF8A7E; --bad-bg:#3D1C19; --almost:#FFB74D; --almost-bg:#3A2A10;
  --m0:#A98BFF; --m1:#FFA94D; --m2:#4CC9D9; --m3:#FF7FC8; --m4:#A6CF5A; --m5:#D1A07E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#main{max-width:38rem;margin:0 auto;padding:1.25rem 1.1rem 7.5rem}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0 0 .5rem;letter-spacing:-.01em;font-weight:750}
h1{font-size:2.15rem;font-weight:800}
h2{font-size:1.55rem;margin-top:1.75rem}
h3{font-size:1.15rem;margin-top:1.25rem}
p{margin:.45rem 0}
a{color:inherit}
button{font:inherit;color:inherit}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.lead{font-size:1.08rem;color:var(--ink-2);margin:.25rem 0 1rem}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark.noun{background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%);color:inherit;padding:0 .08em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.65rem 1.15rem;border-radius:var(--r);border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1.2;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--line);background:var(--surface)}
.btn.block{display:flex;width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(1px)}
.linkish{background:none;border:0;padding:.5rem 0;color:var(--ink-2);text-decoration:underline;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:.6rem;margin:1.25rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* Audio buttons */
.say-grp{display:inline-flex;gap:.3rem;flex:none}
.say{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;font-size:19px;line-height:1}
.say svg{width:20px;height:20px}
.say:active{transform:scale(.93)}
.say.mic.rec-on{background:var(--bad);border-color:var(--bad);color:var(--paper);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--bad) 25%,transparent)}}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .inner{max-width:38rem;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:.5rem 0 .45rem;color:var(--ink-3);text-decoration:none;font-size:.8rem;font-weight:700}
#tabs .ico{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
#tabs svg{width:23px;height:23px}
#tabs a.on{color:var(--ink)}
#tabs a.on .ico{background:var(--accent);color:var(--accent-ink)}
body.no-tabs #tabs{display:none}

/* Toast */
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:center;padding:0 1rem;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:none}
.toast-in{pointer-events:auto;max-width:34rem;width:100%;background:var(--ink);color:var(--paper);border-radius:16px;padding:.85rem 3rem .85rem 1rem;position:relative;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast-in.ok{border-left:6px solid var(--ok)} .toast-in.almost{border-left:6px solid var(--almost)} .toast-in.bad{border-left:6px solid var(--bad)}
.toast-x{position:absolute;top:.35rem;right:.35rem;width:40px;height:40px;border:0;background:transparent;color:inherit;font-size:1.4rem;cursor:pointer;border-radius:50%}
.toast-in .say{border-color:transparent;background:color-mix(in srgb,var(--paper) 16%,transparent);color:inherit;width:38px;height:38px;margin-top:.35rem}

/* Home */
.brand{font-family:var(--font-display);font-weight:800;font-size:1rem;margin:0 0 .75rem;display:inline-block;background:var(--accent);color:var(--accent-ink);padding:.15rem .6rem;border-radius:8px;transform:rotate(-1.5deg)}
.hello{font-size:clamp(2.4rem,11vw,3.2rem);letter-spacing:-.025em;margin:0}
.home-sub{color:var(--ink-2);margin:.35rem 0 0}
.cont{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-l);padding:1.1rem;text-decoration:none;margin:1.4rem 0 1rem}
.cont .big{font-family:var(--font-display);font-weight:800;font-size:4.2rem;line-height:.78;letter-spacing:-.04em;align-self:start}
.cont h2{margin:0;font-size:1.5rem}
.cont .sub{font-size:.95rem}
.cont .go{grid-column:1/-1;margin-top:.6rem;background:var(--accent-ink);color:var(--accent);border-radius:12px;text-align:center;padding:.8rem;font-weight:700}
.summary{color:var(--ink-2)}
.summary a{font-weight:700;color:var(--ink)}
.name-f{border:2px solid var(--ink);border-radius:var(--r-l);padding:1rem;margin:1.25rem 0 0;background:var(--surface)}
.name-f label{font-weight:700;display:block;margin-bottom:.5rem}
.name-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.name-row span{font-family:var(--font-display);font-weight:750;font-size:1.2rem}
.name-row .txt-in{flex:1;min-width:8rem}
.back-banner{border:2px dashed var(--ink);border-radius:var(--r-l);padding:1rem;margin:1.25rem 0 0}
.back-banner h2{margin:0 0 .25rem;font-size:1.35rem}
.all-done{border:2px solid var(--ink);border-radius:var(--r-l);padding:1.1rem;margin:1.4rem 0 1rem;background:var(--surface)}
.all-done h2{margin-top:0}

/* Path */
.path{list-style:none;margin:.5rem 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:21px;top:26px;bottom:26px;width:2px;background:var(--line)}
.pi{display:grid;grid-template-columns:44px 1fr auto;gap:.9rem;align-items:center;padding:.55rem 0;color:inherit;text-decoration:none}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.1rem;background:var(--paper);border:2px solid var(--ink);position:relative;z-index:1}
.node svg{width:22px;height:22px}
.node.done{background:var(--ink);color:var(--paper)}
.node.prog{border:0;background:radial-gradient(closest-side,var(--paper) 80%,transparent 82% 100%),conic-gradient(var(--ink) calc(var(--p)*1%),var(--line) 0)}
.node.soon{border-style:dashed;border-color:var(--ink-3);color:var(--ink-3)}
.pi-t b{display:block;font-family:var(--font-display);font-size:1.12rem;line-height:1.2}
.pi-t span{display:block;color:var(--ink-2);font-size:.92rem;line-height:1.3}
.pi-s{font-size:.82rem;color:var(--ink-2);text-align:right;white-space:nowrap}
li.soon .pi-t b{color:var(--ink-2)}

/* Lesson header + footer */
.ltop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);margin:-1.25rem -1.1rem 1rem;padding:.7rem 1.1rem .7rem;border-bottom:1px solid var(--line)}
.ltop-row{display:flex;align-items:center;gap:.6rem}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink)}
.back svg{width:24px;height:24px}
.ltitle{display:flex;align-items:center;gap:.6rem;min-width:0}
.lnum{font-family:var(--font-display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.04em}
.ltitle h1{font-size:1.3rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltitle p{margin:0;font-size:.85rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:.6rem}
.steps a{font-size:.75rem;text-align:center;padding:.5rem 0;border-radius:9px;background:var(--sunk);color:var(--ink-2);text-decoration:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps a.done{box-shadow:inset 0 -4px 0 var(--accent);color:var(--ink)}
.steps a.cur{background:var(--ink);color:var(--paper)}
.sfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:.7rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px))}
.sfoot .inner{max-width:38rem;margin:0 auto}

/* Boards */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin:.75rem 0 .5rem}
.board.nums{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.tile{aspect-ratio:1/1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:.2rem}
.tile b{font-family:var(--font-display);font-size:1.55rem;line-height:1;font-weight:750}
.tile small{font-size:.7rem;color:var(--ink-2);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.tile.extra{border-color:var(--accent);background:var(--accent-soft)}
.tile:active{transform:scale(.95)}
.numtry{border:2px dashed var(--line);border-radius:var(--r-l);padding:1rem;margin:1rem 0 .5rem}
.numtry-n{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1;min-width:3ch}
.numtry-w{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:.5rem 0 0}

/* Words */
.words{list-style:none;padding:0;margin:.5rem 0 0;background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line);overflow:hidden}
.word{display:flex;align-items:center;gap:.5rem;padding:.75rem .7rem .75rem 1rem;border-top:1px solid var(--line);position:relative}
.word:first-child{border-top:0}
.word::before{content:"";position:absolute;left:0;top:.75rem;bottom:.75rem;width:5px;border-radius:0 5px 5px 0;background:var(--g,transparent)}
.g-der{--g:var(--der)} .g-die{--g:var(--die)} .g-das{--g:var(--das)}
.w-main{flex:1;min-width:0}
.w-de{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-display);font-size:1.22rem;font-weight:750;text-align:left;line-height:1.25}
.art{color:var(--g)}
.w-pl{background:none;border:0;padding:0;cursor:pointer;font-size:.9rem;color:var(--pl);text-align:left}
.w-pl i{font-style:normal;font-size:.78rem;margin-right:.25rem}
.w-en{color:var(--ink-2);font-size:.95rem;line-height:1.35}
.w-note{font-size:.84rem;background:var(--accent-soft);padding:.1rem .45rem;border-radius:6px;display:inline-block;margin-top:.3rem;line-height:1.35}
.legend{display:flex;gap:.9rem;font-size:.88rem;margin:.25rem 0 .5rem;font-weight:700}
.legend span{color:var(--g)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--g);margin-right:.35rem;vertical-align:0}

/* False friend */
.ff{border:2px solid var(--ink);border-radius:var(--r-l);padding:1rem;background:var(--surface);margin:1.5rem 0 0}
.ff-tag{display:inline-block;background:var(--ink);color:var(--paper);font-weight:700;font-size:.82rem;padding:.12rem .6rem;border-radius:999px;margin-bottom:.5rem}
.ff-w{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.ff-w b{font-family:var(--font-display);font-size:1.5rem}
.ff .trap{color:var(--ink-2)}
.ff .ex{border-left:3px solid var(--accent);padding-left:.7rem;margin-top:.6rem}
.ffs{display:flex;flex-direction:column;gap:.75rem}
.ffs .ff{margin:0}
.ff-src{font-size:.8rem;color:var(--ink-3)}

/* Grammar */
.prose p{margin:.55rem 0}
.prose ul{padding-left:1.2rem;margin:.4rem 0}
.prose li{margin:.25rem 0}
.gs{font-weight:700}
.gs.der{color:var(--der)} .gs.die{color:var(--die)} .gs.das{color:var(--das)}
.tbl-wrap{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{padding:.35rem .6rem;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-family:var(--font-display);font-size:.95rem;background:var(--sunk)}
tbody th{font-weight:700;color:var(--ink-2)}
tbody th small{display:block;font-weight:400;font-size:.75rem;color:var(--ink-3)}
td button{background:none;border:0;padding:.3rem 0;cursor:pointer;font-weight:700;text-align:left;border-bottom:1px dotted var(--ink-3)}
.ex{list-style:none;padding:0;margin:.5rem 0 0}
.ex li{display:flex;align-items:center;gap:.6rem;padding:.65rem 0;border-top:1px solid var(--line)}
.ex li:first-child{border-top:0}
.ex li>div{flex:1;min-width:0}
.ex-de{font-size:1.12rem;font-weight:700;margin:0;line-height:1.35}
.ex-en{margin:0;color:var(--ink-2);font-size:.93rem}
.tip{background:var(--accent-soft);border-radius:var(--r);padding:.8rem 1rem;margin:1.25rem 0 0}
.tip b:first-child{margin-right:.3rem}

/* Tasks */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:1rem 1rem 1.1rem;margin:0 0 1rem}
.task-h{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.5rem}
.task-h h3{margin:0;font-size:1.1rem}
.task-n{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--ink-3);min-width:1ch}
.gap-line{display:block;padding:.6rem 0;font-size:1.1rem;border-top:1px dashed var(--line);line-height:1.9}
.gap-line:first-of-type{border-top:0}
.gap-in{font:inherit;font-weight:700;border:0;border-bottom:2px solid var(--ink);background:var(--sunk);border-radius:6px 6px 0 0;padding:.05rem .4rem;width:calc(var(--w,5) * 0.72em + 1.4rem);max-width:100%;color:var(--ink);font-size:1.05rem}
.gap-en{display:block;font-size:.85rem;color:var(--ink-3);line-height:1.3}
.txt-in{width:100%;font:inherit;font-size:1.05rem;padding:.65rem .75rem;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.txt-in:focus,.gap-in:focus{outline:none;border-color:var(--ink)}
.in-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.in-bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.in-almost{border-color:var(--almost)!important;background:var(--almost-bg)!important}
.in-shown{border-color:var(--ink-3)!important;border-style:dashed!important}
.tr-item,.dict-item{padding:.7rem 0;border-top:1px dashed var(--line)}
.tr-item:first-of-type,.dict-item:first-of-type{border-top:0}
.tr-prompt{font-weight:700;margin:0 0 .4rem}
.dict-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.dict-n{font-family:var(--font-display);font-weight:800;color:var(--ink-3);width:1.4rem}
.sol{margin:.45rem 0 0;padding:.4rem .7rem;border-radius:10px;background:var(--ok-bg);color:var(--ink);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sol b{font-weight:700}
.sol .say{width:36px;height:36px}
.explain{display:block;font-size:.88rem;color:var(--ink-2);background:var(--accent-soft);padding:.3rem .55rem;border-radius:8px;margin-top:.35rem;line-height:1.4}
.mc-item{padding:.6rem 0;border-top:1px dashed var(--line)}
.mc-item:first-of-type{border-top:0}
.mc-q{font-weight:700;margin:0 0 .35rem}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.5rem .8rem;min-height:44px;cursor:pointer;font-weight:700;text-align:left;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.task-fb{min-height:1.3em;margin:.7rem 0 .5rem;font-weight:700}
.task-fb.ok{color:var(--ok)} .task-fb.bad{color:var(--bad)} .task-fb.almost{color:var(--almost)} .task-fb.info{color:var(--ink-2)}
.task-act{display:flex;gap:.5rem;flex-wrap:wrap}
.task-act .btn{flex:1;min-width:7.5rem;padding-inline:.7rem}
.uml{display:flex;gap:.35rem;margin:.6rem 0 0;align-items:center}
.uml span{font-size:.8rem;color:var(--ink-3);margin-right:.2rem}
.uml button{min-width:44px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:1.05rem;cursor:pointer}
/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.match .col{display:flex;flex-direction:column;gap:.5rem}
.mi{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.55rem .65rem;min-height:48px;text-align:left;cursor:pointer;font-weight:700;line-height:1.25}
.mi.sel{border-color:var(--ink);background:var(--accent-soft)}
.mi.paired{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--paper))}
.mi .pb{position:absolute;top:-9px;right:-5px;background:var(--pc);color:var(--paper);border-radius:999px;font-size:.72rem;padding:.05rem .45rem;font-weight:700}
.mi.ok{border-color:var(--ok);background:var(--ok-bg)}
.mi.bad{border-color:var(--bad);background:var(--bad-bg)}
.mi.ok .pb{background:var(--ok)} .mi.bad .pb{background:var(--bad)}

/* Listening */
.player{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}
.player .btn{flex:1;min-width:7rem}
.dlg{margin:.75rem 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:.3rem .9rem}
.dl{display:grid;grid-template-columns:4.2rem 1fr auto;gap:.5rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.dl p{margin:0}
.dl .de{font-weight:700;line-height:1.35}
.who{font-family:var(--font-display);font-weight:750;font-size:.95rem}
.who-A{color:var(--m2)} .who-B{color:var(--m1)}
.dl.speaking{background:var(--accent-soft);margin:0 -.9rem;padding-left:.9rem;padding-right:.9rem}

/* Sound */
.snd-head{display:flex;align-items:flex-end;gap:1rem;margin:0 0 .5rem}
.glyph{font-family:var(--font-display);font-weight:800;font-size:clamp(5.5rem,28vw,8rem);line-height:.85;letter-spacing:-.04em;background:linear-gradient(transparent 58%,var(--hl) 58% 90%,transparent 90%);padding:0 .08em}
.snd-head h2{margin:0 0 .3rem;font-size:1.45rem}
.howto{padding-left:1.2rem;margin:.5rem 0}
.howto li{margin:.4rem 0}
.snd-note{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-left:.25rem;color:var(--ink-2)}
.pairs{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0}
.pair{display:flex;align-items:center;gap:.6rem}
.pw{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem;font-family:var(--font-display);font-size:1.2rem;font-weight:750;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:.4rem}
.pw svg{width:16px;height:16px;opacity:.6}
.twister{margin:1.5rem 0 0;border:2px dashed var(--ink);border-radius:var(--r-l);padding:1rem}
.twister h3{margin-top:0}
.tw-de{font-size:1.2rem;font-weight:700;line-height:1.4}

/* Done */
.done-k{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,15vw,4.5rem);line-height:.9;letter-spacing:-.03em;margin:1.5rem 0 .75rem;display:inline-block;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%)}

/* Word box */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem;align-items:end;height:150px;margin:1.25rem 0 .3rem}
.bx{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:.25rem}
.bx b{font-family:var(--font-display);font-size:1.15rem}
.bx .bar{width:100%;background:var(--ink);border-radius:8px 8px 3px 3px;min-height:6px}
.bx:first-child .bar{background:var(--accent)}
.bx-labs{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem;font-size:.74rem;color:var(--ink-2);text-align:center;line-height:1.25}
.bx-labs b{display:block;color:var(--ink);font-size:.8rem}
.sess-top{display:flex;align-items:center;gap:.75rem}
.sess-bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.sess-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.fcard{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-l);padding:1.3rem 1.15rem;margin:1rem 0}
.fc-meta{font-size:.82rem;color:var(--ink-3);margin:0 0 .4rem}
.fc-prompt{font-family:var(--font-display);font-size:1.75rem;font-weight:750;line-height:1.15;margin:0 0 .35rem}
.fc-hint{color:var(--ink-2);font-size:.92rem;margin:0 0 .9rem}
.fc-ans{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 0}
.fc-ans b{font-family:var(--font-display);font-size:1.6rem;font-weight:750}
.fc-fb{font-weight:700;margin:.8rem 0 0}
.fc-fb.ok{color:var(--ok)} .fc-fb.bad{color:var(--bad)} .fc-fb.almost{color:var(--almost)}

/* Extras */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:1rem;margin:.75rem 0}
.set label{display:block;font-weight:700;margin:0 0 .35rem}
.set select.txt-in{appearance:auto}
.set + .set{margin-top:.75rem}
.set input[type=range]{width:100%;accent-color:var(--ink)}
.danger{border-color:var(--bad)!important;color:var(--bad)!important}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){ #main{padding-top:2rem} .ltop{margin-top:-2rem} }
</style>

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   LESSON DATA
   ---------------------------------------------------------------------
   Every lesson is one plain object in LESSONS. To add a lesson: copy a
   finished lesson, give it the next id/n, delete `soon: true` from the
   placeholder, and fill in the parts below. Nothing else needs changing.

   vocab (8–12):   { de, art?, pl?, en, note?, cue?, say?, alt? }
                   art  "der" | "die" | "das" for nouns (shown in colour)
                   pl   full plural with article ("die Tische")
                   cue  English prompt in the word box if `en` is vague
                   say  what the speaker reads, if it differs from `de`
                   alt  extra answers the word box accepts
   board:          optional "alphabet" | "numbers" (tap-to-hear grid)
   grammar:        { title, html, table?, examples:[{ de, en }], tip? }
                   table { head:[…], rows:[[…]], gloss?:[…],
                           sayCols:[col indexes], prefixRow?:bool }
                   In examples, *asterisks* highlight a word.
   exercises (4–6): { type, instruction, … }
                   gap        items:[{ text:"Ich ___ müde.", answers:["bin"], en?, explain? }]
                   match      pairs:[["der Vater","father"], …]
                   mc         items:[{ q, options:[…], answer:<index>, explain? }]
                   translate  items:[{ prompt, answers:[…] }]
   listening:      { mode:"dictation", instruction,
                     items:[{ say, answers, show?, en?, hint?, compact? }] }
                   { mode:"dialog", instruction,
                     lines:[{ who:"A"|"B", name, de, en }], questions:[mc items] }
                   compact: spaces are ignored when checking (numbers)
   pronunciation:  { sound, title, intro, howTo:[…], examples:[{ de, en, note? }],
                     pairsLabel?, pairs?:[[a,b]], tip?, twister:{ de, en } }
   falseFriend:    id of an entry in FALSE_FRIENDS

   Checking is tolerant: capitals, punctuation and ae/oe/ue/ss for
   ä/ö/ü/ß never count as mistakes.
   ===================================================================== */

const LESSONS = [
/* ------------------------------------------------------------------ 1 */
{
  id: "l1", n: 1,
  title: "Das Alphabet",
  en: "The alphabet and your first words",
  intro: "Willkommen! German is spelt almost exactly the way it sounds, so once you know the letters you can read nearly any word out loud. Tap a letter to hear it.",
  board: "alphabet",
  vocab: [
    { de: "Alphabet", art: "das", pl: "die Alphabete", en: "alphabet" },
    { de: "Buchstabe", art: "der", pl: "die Buchstaben", en: "letter (of the alphabet)", note: "A letter you post is der Brief." },
    { de: "Wort", art: "das", pl: "die Wörter", en: "word" },
    { de: "Name", art: "der", pl: "die Namen", en: "name" },
    { de: "Frage", art: "die", pl: "die Fragen", en: "question" },
    { de: "Antwort", art: "die", pl: "die Antworten", en: "answer" },
    { de: "ja", en: "yes" },
    { de: "nein", en: "no" },
    { de: "bitte", en: "please; you're welcome" },
    { de: "danke", en: "thanks", alt: ["danke schön", "dankeschön", "vielen Dank"] },
    { de: "Wie bitte?", en: "Sorry? / Pardon?", cue: "Sorry? (you didn't catch what someone said)" },
    { de: "buchstabieren", en: "to spell" }
  ],
  grammar: {
    title: "Every noun starts with a capital letter",
    html: `<p>In English only names get a capital letter. In German, <b>every noun</b> does: not just <i>Anna</i> and <i>Galway</i>, but also everyday things like <i>das Wort</i>, <i>die Frage</i>, <i>der Tee</i>.</p>
<p>This is a real help when you read: the capitalised words in the middle of a sentence are the things. Verbs, adjectives and small words like <i>ja</i>, <i>bitte</i> and <i>und</i> stay lowercase, except at the very start of a sentence.</p>`,
    examples: [
      { de: "Das ist ein *Wort*.", en: "That is a word." },
      { de: "Mein *Name* ist *Anna*.", en: "My name is Anna." },
      { de: "Die *Antwort* ist ja.", en: "The answer is yes." },
      { de: "*Galway* ist eine *Stadt* in *Irland*.", en: "Galway is a city in Ireland." }
    ],
    tip: `<b>Tip:</b> the word for <i>I</i> is the other way round. English writes "I" with a capital, German writes <i>ich</i> in lowercase, unless it starts the sentence: <i>Ja, ich komme.</i>`
  },
  exercises: [
    { type: "mc", instruction: "Which spelling is correct?", items: [
      { q: "the word", options: ["das wort", "das Wort", "Das wort"], answer: 1 },
      { q: "the question and the answer", options: ["die frage und die antwort", "die Frage und die Antwort", "Die Frage Und Die Antwort"], answer: 1 },
      { q: "Yes, please. (a whole sentence)", options: ["Ja, Bitte.", "ja, bitte.", "Ja, bitte."], answer: 2, explain: "Capital J because it starts the sentence. bitte isn't a noun, so it stays lowercase." }
    ]},
    { type: "match", instruction: "Match the German to the English.", pairs: [
      ["ja", "yes"], ["nein", "no"], ["bitte", "please"], ["danke", "thanks"], ["Wie bitte?", "Sorry? (didn't catch it)"], ["buchstabieren", "to spell"]
    ]},
    { type: "gap", instruction: "Fill in the missing word.", items: [
      { text: "Das Alphabet hat 26 ___, plus ä, ö, ü und ß.", answers: ["Buchstaben"], en: "The alphabet has 26 letters, plus ä, ö, ü and ß." },
      { text: "Mein ___ ist Aoife.", answers: ["Name"], en: "My name is Aoife." },
      { text: "Das ist eine Frage. Und das ist die ___.", answers: ["Antwort"], en: "That is a question. And that is the answer." },
      { text: "„Hallo“ ist ein ___.", answers: ["Wort"], en: "“Hallo” is a word." }
    ]},
    { type: "mc", instruction: "How do these letters sound in German?", items: [
      { q: "W, as in Wort", options: ["like English w", "like English v", "like English f"], answer: 1 },
      { q: "J, as in ja", options: ["like j in jam", "like y in yes", "like h in hat"], answer: 1 },
      { q: "Z, as in zehn", options: ["like z in zoo", "like ts in cats", "like s in sun"], answer: 1 },
      { q: "V, as in vier", options: ["like English v", "like English f", "like English w"], answer: 1, explain: "In most German words v sounds like f: vier, Vater, viel. In some borrowed words like Video it's a v." }
    ]},
    { type: "translate", instruction: "Write it in German.", items: [
      { prompt: "yes", answers: ["ja"] },
      { prompt: "thank you", answers: ["danke", "danke schön", "dankeschön", "vielen Dank"] },
      { prompt: "Sorry? (you didn't catch it)", answers: ["Wie bitte?"] },
      { prompt: "the letters (of the alphabet)", answers: ["die Buchstaben"] },
      { prompt: "the words", answers: ["die Wörter"] }
    ]}
  ],
  listening: {
    mode: "dictation",
    instruction: "Listen and write what you hear. Play it as often as you like, slowly too.",
    items: [
      { say: "Ja, danke!", answers: ["Ja, danke!"], en: "Yes, thanks!" },
      { say: "Wie bitte?", answers: ["Wie bitte?"], en: "Sorry?" },
      { say: "Das ist ein Wort.", answers: ["Das ist ein Wort."], en: "That is a word." },
      { say: "D, U, B, L, I, N", answers: ["Dublin"], show: "D – U – B – L – I – N: Dublin", en: "", hint: "A spelled word. Write the whole word.", compact: true }
    ]
  },
  pronunciation: {
    sound: "w",
    title: "W sounds like English v",
    intro: "Simple but sneaky: German w is always pronounced like an English v. Your lips don't round at all. Your top teeth rest on your bottom lip.",
    howTo: [
      "Say the English word “vine”.",
      "Keep exactly that v and say <i>Wein</i> (wine).",
      "Now <i>wie</i> (how): it sounds like the English letter V."
    ],
    examples: [
      { de: "das Wort", en: "word" },
      { de: "wie", en: "how" },
      { de: "das Wasser", en: "water" },
      { de: "der Wein", en: "wine" },
      { de: "Wie bitte?", en: "Sorry?" }
    ],
    pairsLabel: "Hear the difference: w sounds like v, v sounds like f",
    pairs: [["wir", "vier"], ["Wein", "fein"]],
    tip: "<b>Irish tip:</b> you already know this from names like Niamh (NEEV): mh makes a v sound. German w is that same v.",
    twister: { de: "Wir Wiener Waschweiber würden weiße Wäsche waschen, wenn wir wüssten, wo warmes, weiches Wasser wär.", en: "We Viennese washerwomen would wash white laundry if we knew where there was warm, soft water." }
  },
  falseFriend: "also"
},

/* ------------------------------------------------------------------ 2 */
{
  id: "l2", n: 2,
  title: "Hallo & Tschüss",
  en: "Greetings and introducing yourself",
  intro: "Time to say hello, give your name and say where you're from. By the end of this lesson you can manage your first little conversation.",
  vocab: [
    { de: "Hallo!", en: "Hello! / Hi!" },
    { de: "Guten Morgen!", en: "Good morning!" },
    { de: "Guten Tag!", en: "Hello! (a bit formal, daytime)" },
    { de: "Guten Abend!", en: "Good evening!" },
    { de: "Tschüss!", en: "Bye!", alt: ["Tschüs!"] },
    { de: "Auf Wiedersehen!", en: "Goodbye! (formal)" },
    { de: "heißen", en: "to be called" },
    { de: "kommen (aus)", say: "kommen", en: "to come (from)", alt: ["kommen", "kommen aus"] },
    { de: "wohnen (in)", say: "wohnen", en: "to live (in a place)", alt: ["wohnen", "wohnen in"] },
    { de: "Herr", art: "der", pl: "die Herren", en: "Mr; gentleman" },
    { de: "Frau", art: "die", pl: "die Frauen", en: "Mrs / Ms; woman" },
    { de: "Land", art: "das", pl: "die Länder", en: "country" }
  ],
  grammar: {
    title: "du or Sie: two ways to say “you”",
    html: `<p>German has two words for <i>you</i> when you talk to one person.</p>
<p><b>du</b> is informal: for friends, family, children, and people your age in relaxed places like a hostel, a pub, a football team or online.</p>
<p><b>Sie</b> is formal: for adults you don't know, in shops and offices, and with a boss or a teacher. <i>Sie</i> always has a capital S.</p>
<p>The verb changes with it: <i>du</i> takes <b>-st</b>, <i>Sie</i> takes <b>-en</b>. Not sure? Start with <i>Sie</i>. If the other person prefers <i>du</i>, they'll tell you: <i>Wir können uns duzen.</i> (We can say du to each other.)</p>`,
    table: {
      head: ["", "heißen", "kommen", "wohnen"],
      rows: [["ich", "heiße", "komme", "wohne"], ["du", "heißt", "kommst", "wohnst"], ["Sie", "heißen", "kommen", "wohnen"]],
      gloss: ["I", "you (informal)", "you (formal)"],
      sayCols: [1, 2, 3], prefixRow: true
    },
    examples: [
      { de: "Wie heißt du? Ich heiße Liam.", en: "What's your name? My name is Liam." },
      { de: "Wie heißen Sie? Ich heiße Anna Weber.", en: "What's your name? (formal) My name is Anna Weber." },
      { de: "Woher kommst du? Ich komme aus Irland.", en: "Where are you from? I'm from Ireland." },
      { de: "Wo wohnen Sie? Ich wohne in Galway.", en: "Where do you live? (formal) I live in Galway." }
    ],
    tip: `<b>Watch out:</b> <i>wo?</i> means where, <i>woher?</i> means where from, and <i>wer?</i> means who, not where.`
  },
  exercises: [
    { type: "mc", instruction: "du or Sie? Pick the right one.", items: [
      { q: "You meet your friend's little brother. He's eight.", options: ["du", "Sie"], answer: 0 },
      { q: "You ask a police officer for directions.", options: ["du", "Sie"], answer: 1 },
      { q: "Someone your age in a hostel says: „Hi, ich bin Tom!“", options: ["du", "Sie"], answer: 0 },
      { q: "You write an email to a hotel.", options: ["du", "Sie"], answer: 1 }
    ]},
    { type: "gap", instruction: "Fill in the gap.", items: [
      { text: "Wie ___ du? Ich heiße Ciara.", answers: ["heißt"], en: "What's your name? My name is Ciara." },
      { text: "Woher ___ Sie? Aus Irland.", answers: ["kommen"], en: "Where are you from? From Ireland." },
      { text: "Ich ___ in Galway.", answers: ["wohne"], en: "I live in Galway." },
      { text: "Wo ___ du?", answers: ["wohnst"], en: "Where do you live?" },
      { text: "Guten ___! (It's 8 a.m.)", answers: ["Morgen"], en: "Good morning!" }
    ]},
    { type: "match", instruction: "Match them up.", pairs: [
      ["Tschüss!", "Bye!"], ["Auf Wiedersehen!", "Goodbye! (formal)"], ["Guten Abend!", "Good evening!"],
      ["das Land", "the country"], ["die Frau", "Mrs; the woman"], ["der Herr", "Mr; the gentleman"]
    ]},
    { type: "mc", instruction: "Choose the best answer.", items: [
      { q: "Woher kommen Sie?", options: ["Ich wohne in Dublin.", "Ich komme aus Irland.", "Ich heiße Irland."], answer: 1 },
      { q: "Wie heißt du?", options: ["Ich heiße Conor.", "Ich komme aus Conor.", "Guten Morgen, Conor!"], answer: 0 },
      { q: "Wo wohnst du?", options: ["In Cork.", "Aus Cork.", "Tschüss, Cork!"], answer: 0, explain: "wo? (where) takes in; woher? (where from) takes aus." }
    ]},
    { type: "translate", instruction: "Write it in German.", items: [
      { prompt: "My name is Orla.", answers: ["Ich heiße Orla.", "Mein Name ist Orla.", "Ich bin Orla."] },
      { prompt: "I come from Ireland.", answers: ["Ich komme aus Irland."] },
      { prompt: "Where do you live? (informal)", answers: ["Wo wohnst du?"] },
      { prompt: "Goodbye, Mrs Weber!", answers: ["Auf Wiedersehen, Frau Weber!"] }
    ]}
  ],
  listening: {
    mode: "dialog",
    instruction: "Anna and Liam meet at a conference in Cologne (Köln). Listen first, then answer.",
    lines: [
      { who: "A", name: "Anna", de: "Guten Tag! Ich heiße Anna Weber. Wie heißen Sie?", en: "Hello! My name is Anna Weber. What's your name?" },
      { who: "B", name: "Liam", de: "Guten Tag, Frau Weber. Ich heiße Liam Kelly.", en: "Hello, Ms Weber. My name is Liam Kelly." },
      { who: "A", name: "Anna", de: "Woher kommen Sie, Herr Kelly?", en: "Where are you from, Mr Kelly?" },
      { who: "B", name: "Liam", de: "Ich komme aus Irland, aus Cork. Und Sie?", en: "I'm from Ireland, from Cork. And you?" },
      { who: "A", name: "Anna", de: "Ich komme aus Deutschland. Ich wohne hier in Köln.", en: "I'm from Germany. I live here in Cologne." },
      { who: "B", name: "Liam", de: "Ah, Köln! Schön!", en: "Ah, Cologne! Nice!" }
    ],
    questions: [
      { q: "Where is Liam from?", options: ["Cologne", "Cork", "Dublin"], answer: 1 },
      { q: "Where does Anna live?", options: ["Cork", "Berlin", "Cologne"], answer: 2 },
      { q: "Do they say du or Sie to each other?", options: ["du", "Sie"], answer: 1 }
    ]
  },
  pronunciation: {
    sound: "ch",
    title: "Two sounds for ch",
    intro: "German ch comes in two versions. Which one you use depends on the sound right before it.",
    howTo: [
      "After <b>a, o, u, au</b>: the <i>ach</i> sound. Rough, at the back of the throat, like in “loch”.",
      "After <b>e, i, ä, ö, ü</b> and after consonants: the <i>ich</i> sound. Soft, like a whispered h at the start of “huge”.",
      "Never say it like k or sh: <i>ich</i> is neither “ick” nor “ish”."
    ],
    examples: [
      { de: "ich", en: "I", note: "ich sound" },
      { de: "nicht", en: "not", note: "ich sound" },
      { de: "die Milch", en: "milk", note: "ich sound" },
      { de: "acht", en: "eight", note: "ach sound" },
      { de: "das Buch", en: "book", note: "ach sound" },
      { de: "auch", en: "also, too", note: "ach sound" }
    ],
    pairsLabel: "Watch it switch: add an umlaut and ach becomes ich",
    pairs: [["Buch", "Bücher"], ["Nacht", "Nächte"], ["Koch", "Köche"]],
    tip: "<b>Irish tip:</b> Irish has both sounds! Broad ch in <i>loch</i> is the ach sound, and slender ch in <i>oíche</i> (night) is very close to the ich sound.",
    twister: { de: "Ich mache acht Kuchen, doch nicht nachts!", en: "I'm making eight cakes, but not at night!" }
  },
  falseFriend: "chef"
},

/* ------------------------------------------------------------------ 3 */
{
  id: "l3", n: 3,
  title: "Zahlen",
  en: "Numbers from 0 to 100",
  intro: "Numbers are everywhere: prices, phone numbers, ages, the bus. German says 21 as “one-and-twenty”, which feels odd at first and then clicks. Tap any number to hear it.",
  board: "numbers",
  vocab: [
    { de: "Zahl", art: "die", pl: "die Zahlen", en: "number (a figure like 7 or 42)", note: "A number that labels something (phone, room, bus) is die Nummer." },
    { de: "Telefonnummer", art: "die", pl: "die Telefonnummern", en: "phone number" },
    { de: "Hausnummer", art: "die", pl: "die Hausnummern", en: "house number" },
    { de: "Adresse", art: "die", pl: "die Adressen", en: "address" },
    { de: "Jahr", art: "das", pl: "die Jahre", en: "year" },
    { de: "Euro", art: "der", pl: "die Euros", en: "euro", note: "After a number there's no plural: zehn Euro." },

/* ---------- Numbers ---------- */
const ONES = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn'];
const TENS = ['', '', 'zwanzig', 'dreißig', 'vierzig', 'fünfzig', 'sechzig', 'siebzig', 'achtzig', 'neunzig'];
function numWord(n) {
  if (n < 20) return ONES[n];
  if (n === 100) return 'hundert';
  const t = Math.floor(n / 10), u = n % 10;
  return u ? (u === 1 ? 'ein' : ONES[u]) + 'und' + TENS[t] : TENS[t];

/* ---------- Tolerant checking ----------
   Case, punctuation, quotes, accents and ae/oe/ue/ss vs ä/ö/ü/ß
   never count as mistakes. */
function norm(s) {
  return String(s == null ? '' : s).toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[„“”‚‘’'"«»€]/g, '')
    .replace(/[.,!?;:()\/\u2013\u2014-]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }

}

function grade(input, answers, compact = false) {
  const f = compact ? x => norm(x).replace(/ /g, '') : norm;
  const u = f(input);
  if (!u) return 'empty';
  if (answers.some(a => f(a) === u)) return 'ok';
  if (answers.some(a => { const t = f(a); return t.length >= 4 && lev(t, u) <= (t.length > 14 ? 2 : 1); })) return 'almost';
  return 'bad';
}

/* ---------- Optional sync to the viewer's Claude account ----------
   Works only when the page is opened signed in with write access;
   otherwise progress simply stays in this browser. */
const Sync = {
  ref: null, status: 'local', busy: false, dirty: false, t: null,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      this.ref = ref;
      const remote = snap.exists && snap.data() && snap.data().json ? JSON.parse(snap.data().json) : null;
      if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
        const lastVisit = S.lastVisit;
        S = normalizeState(remote); S.lastVisit = lastVisit; saveLocal();
        if (UI.view !== 'lesson' && UI.view !== 'session') route();
      } else if (S.updatedAt && (!remote || S.updatedAt > (remote.updatedAt || 0))) {
        await this.push();
      }
      if (this.ref) this.status = 'synced';
      if (UI.view === 'more') route();

  },
  schedule() { if (!this.ref) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.ref) return;
    if (this.busy) { this.dirty = true; return; }
    this.busy = true;
    try { await this.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt }); this.status = 'synced'; }
    catch (e) {
      if (e && e.code === 'unavailable') { this.dirty = true; }
      else { this.ref = null; this.status = 'local'; }
    }
    this.busy = false;
    if (this.dirty && this.ref) { this.dirty = false; setTimeout(() => this.push(), 2000); }
  }
};

/* ---------- Text to speech (Web Speech API, de-DE) ---------- */
const TTS = {
  ok: typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  voices: [], warned: false, token: null, cur: null,
  init() {
    if (!this.ok) return;
    const load = () => {
      this.voices = speechSynthesis.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang)).sort((a, b) => this.score(b) - this.score(a));
      if (UI.view === 'more') refreshVoiceSelect();
    };
    load();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load);
    else speechSynthesis.onvoiceschanged = load;
  },
  score(v) {
    let s = 0; const l = v.lang.replace('_', '-');
    if (l === 'de-DE') s += 4; else s += 1;
    if (/google|premium|enhanced|neural|natural|online/i.test(v.name)) s += 3;
    if (/anna|petra|markus|helena|katja|conrad|hedda|yannick|marlene|vicki/i.test(v.name)) s += 1;
    return s;
  },
  main() {
    if (S.settings.voice) { const v = this.voices.find(x => x.voiceURI === S.settings.voice); if (v) return v; }
    return this.voices[0] || null;
  },
  second() {
    const m = this.main(); if (!m) return null;
    return this.voices.find(v => v !== m && v.lang.replace('_', '-') === m.lang.replace('_', '-')) || null;
  },
  utter(text, { slow = false, voice = null, pitch = 1, onend = null } = {}) {

    u.rate = slow ? 0.6 : (S.settings.rate || 0.95);
    u.pitch = pitch;
    if (onend) { u.onend = onend; u.onerror = onend; }
    this.cur = u; // keep a reference (Chrome drops unreferenced utterances)
    if (speechSynthesis.paused) speechSynthesis.resume();
    speechSynthesis.speak(u);
  },
  speak(text, opts = {}) {
    if (!this.ok) { toast('Audio isn’t available in this browser. Chrome or Safari can read German out loud.'); return; }
    if (!this.voices.length && !this.warned) {
      this.warned = true;
      toast('No German voice was found on this device. Add one in your phone’s text-to-speech settings. Using the default voice for now.');
    }

  },
  stop() { if (!this.ok) return; this.token = null; speechSynthesis.cancel(); onDialogEnd(); },
  /* plays dialogue lines one after the other, two voices if possible */

    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();

    let i = 0;
    const next = () => {
      if (this.token !== token) return;
      if (i >= lines.length) { this.token = null; onDone && onDone(); return; }
      const ln = lines[i]; onLine && onLine(i);
      const isB = ln.who === 'B';
      this.utter(ln.de, {
        slow, voice: isB ? (vB || vA) : vA,
        pitch: vB ? 1 : (isB ? 0.82 : 1.12),

  }

/* ---------- Speech recognition (optional) ---------- */
const SRClass = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const Rec = {
  ok: !!SRClass, active: null,
  similar(target, heard) {

    if (!t || !h) return 0;
    return 1 - lev(t, h) / Math.max(t.length, h.length);
  },
  listen(target, btn) {
    if (!this.ok) { toast('Speaking practice needs speech recognition, which this browser doesn’t have. Chrome on Android and Safari on iPhone support it.'); return; }
    if (this.active) { try { this.active.abort(); } catch (e) { } this.active = null; }
    TTS.stop();
    let r;
    try { r = new SRClass(); } catch (e) { toast('Speech recognition couldn’t start here. Try opening the app in its own browser tab.'); return; }
    r.lang = 'de-DE'; r.interimResults = false; r.maxAlternatives = 4; r.continuous = false;
    let handled = false;
    btn && btn.classList.add('rec-on');

    r.onresult = e => {

      const best = alts.map(a => ({ a, s: this.similar(target, a) })).sort((x, y) => y.s - x.s)[0];
      const say = sayBtns(target);

      else toast(`<b>Not quite yet.</b> I heard: “<span lang="de">${esc(best.a)}</span>”. Listen, then try again.<br>${say}`, { kind: 'bad', sticky: true });
    };
    r.onerror = e => {
      handled = true;
      const m = {
        'not-allowed': 'The microphone is blocked. Allow microphone access, or open the app in its own browser tab.',
        'service-not-allowed': 'The microphone is blocked. Allow microphone access, or open the app in its own browser tab.',
        'no-speech': 'I didn’t hear anything. Tap the mic and start speaking straight away.',
        'audio-capture': 'No microphone was found.',
        'network': 'Speech recognition needs an internet connection.',
        'aborted': ''
      }[e.error];
      if (m === '') hideToast(); else toast(m || 'Speech recognition stopped. Try again.');
    };
    r.onend = () => {
      btn && btn.classList.remove('rec-on');
      if (this.active === r) this.active = null;

  }
};

    h += `<section class="all-done"><h2>All available lessons are done.</h2><p>New lessons are on the way. Until then, a short round in the word box keeps everything fresh.</p><a class="btn primary block" href="#/cards/session">Practise words</a></section>`;
  }
  if (!doneN && !nCards) h += `<p class="summary">Each lesson takes 10–15 minutes. Do them whenever it suits you. Your progress is saved, and Continue always takes you to the right place.</p>`;
  else h += `<p class="summary">You've finished ${doneN} of ${LESSONS.length} lessons and collected ${nCards} words.${due ? ` <a href="#/cards/session">Review ${Math.min(due, 10)} words now</a>` : ''}</p>`;

  h += `<h2>All lessons</h2><ol class="path">${LESSONS.map(pathItem).join('')}</ol>`;
  main().innerHTML = h;
}
function pathItem(l) {
  if (l.soon) return `<li class="soon"><div class="pi"><span class="node soon">${l.n}</span><span class="pi-t"><b lang="de">${esc(l.title)}</b><span>${esc(l.en)}</span></span><span class="pi-s">Coming soon</span></div></li>`;

    : started ? `<span class="node prog" style="--p:${Math.max(n * 20, 4)}">${l.n}</span>`

/* ---------- Lesson ---------- */
function viewLesson(lid, step) {
  const l = LESSON(lid);
  if (!l || l.soon) { go(''); return; }
  if (step === 'done') { viewDone(l); return; }
  if (!STEP_LABEL[step]) step = resumeStep(lid);
  const isNew = !S.lessons[lid];
  const p = lp(lid);
  if (isNew || p.last !== step) { p.last = step; save(); }
  UI.lid = lid; UI.step = step;
  document.body.classList.add('no-tabs');
  const nav = STEPS.map(s => `<a href="#/lesson/${lid}/${s.key}" class="${s.key === step ? 'cur' : ''} ${p.steps[s.key] ? 'done' : ''}" ${s.key === step ? 'aria-current="step"' : ''}>${s.short}</a>`).join('');
  const body = { words: stepWords, grammar: stepGrammar, practice: stepPractice, listen: stepListen, sound: stepSound }[step](l);
  const nk = nextOpenStep(lid, step);
  main().innerHTML = `<header class="ltop"><div class="ltop-row"><a class="back" href="#/" aria-label="All lessons">${IC.back}</a>
      <div class="ltitle"><span class="lnum">${l.n}</span><div><h1 lang="de">${esc(l.title)}</h1><p>${esc(l.en)}</p></div></div></div>
      <nav class="steps" aria-label="Lesson steps">${nav}</nav></header>
    <section>${body}</section>
    <div class="sfoot"><div class="inner"><button class="btn primary block" data-act="next-step">${nk ? 'Continue with ' + STEP_LABEL[nk] : 'Finish lesson'}</button></div></div>`;
  if (step === 'words' && l.board === 'numbers') newRandomNumber();
}

function stepWords(l) {
  let h = `<p class="lead">${esc(l.intro)}</p>`;
  if (l.board === 'alphabet') h += boardAlphabet();
  if (l.board === 'numbers') h += boardNumbers();
  h += `<h2>Words</h2><p class="muted small">Tap a word to hear it, or the turtle to hear it slowly.${Rec.ok ? ' The mic checks your pronunciation.' : ''}</p>`;
  if (l.vocab.some(w => w.art)) h += `<p class="legend"><span class="g-der">der</span><span class="g-die">die</span><span class="g-das">das</span></p>`;
  h += `<ul class="words">${l.vocab.map(wordRow).join('')}</ul>`;
  if (FF[l.falseFriend]) h += ffCard(FF[l.falseFriend]);

}
function wordRow(w) {

    <button class="w-de" data-say="${esc(say)}" lang="de">${w.art ? `<span class="art">${w.art}</span> ` : ''}${esc(w.de)}</button>

function ffCard(f) {

    <div class="ff-w"><b lang="de">${esc(f.de)}</b>${sayBtns(f.de)}</div>

    <div class="ex"><p lang="de"><b>${esc(f.ex[0])}</b></p><p class="muted small">${esc(f.ex[1])}</p></div></article>`;

function boardAlphabet() {
  return `<div class="board">${ALPHABET.map(([L, hint, say], i) => `<button class="tile ${i >= 26 ? 'extra' : ''}" data-say="${esc(say || L)}" aria-label="${esc(L)}, sounds like ${esc(hint)}"><b lang="de">${L}</b><small>${esc(hint)}</small></button>`).join('')}</div>
    <p class="muted small">26 letters, plus ä, ö, ü and ß. The hints are rough English sounds. ß never starts a word, so you'll almost never see it as a capital.</p>`;

function newRandomNumber() {

function stepGrammar(l) {
  const g = l.grammar;
  return `<h2 style="margin-top:0">${esc(g.title)}</h2><div class="prose">${g.html}</div>
    ${g.table ? tableHtml(g.table) : ''}
    <h3>Examples</h3><ul class="ex">${g.examples.map(ex => `<li><div><p class="ex-de" lang="de">${fmtDe(ex.de)}</p><p class="ex-en">${esc(ex.en)}</p></div>${sayBtns(ex.de)}</li>`).join('')}</ul>
    ${g.tip ? `<aside class="tip">${g.tip}</aside>` : ''}`;
}
function tableHtml(t) {
  const sayCols = t.sayCols || [];
  const rows = t.rows.map((r, ri) => `<tr>${r.map((c, ci) => {
    if (ci === 0) return `<th scope="row" lang="de">${esc(c)}${t.gloss ? `<small lang="en">${esc(t.gloss[ri])}</small>` : ''}</th>`;
    if (!sayCols.includes(ci)) return `<td>${esc(c)}</td>`;
    const pron = t.prefixRow ? r[0].split('/')[0].trim() + ' ' : '';
    return `<td><button data-say="${esc(pron + c)}" lang="de">${esc(c)}</button></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${t.head.map(x => `<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>

function stepPractice(l) {

function listenTask(l) {

function stepListen(l) {

function stepSound(l) {

    <p class="lead">${esc(p.intro)}</p>
    <ul class="howto">${p.howTo.map(x => `<li>${x}</li>`).join('')}</ul>

    ${p.pairs ? `<h3>${esc(p.pairsLabel || 'Hear the difference')}</h3><div class="pairs">${p.pairs.map(([a, b]) => `<div class="pair"><button class="pw" data-say="${esc(a)}" lang="de">${IC.speaker}${esc(a)}</button><span class="muted">or</span><button class="pw" data-say="${esc(b)}" lang="de">${IC.speaker}${esc(b)}</button></div>`).join('')}</div>` : ''}
    ${p.tip ? `<aside class="tip">${p.tip}</aside>` : ''}
    <div class="twister"><h3>Tongue twister</h3><p class="tw-de" lang="de">${esc(p.twister.de)}</p><p class="muted">${esc(p.twister.en)}</p>${sayBtns(p.twister.de, { mic: true })}</div>`;
