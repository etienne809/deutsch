function viewDone(l) {
  const nx = AVAILABLE().find(x => x.n > l.n && !isDone(x.id)) || nextLesson();
  main().innerHTML = `<section><p class="done-k" lang="de">Geschafft!</p><h1>Lesson ${l.n} is done.</h1>
    <p>${l.vocab.length} words from <span lang="de">${esc(l.title)}</span> are now in your word box. They'll come back in short reviews, so they stick.</p>
    <div class="stack">${nx ? `<a class="btn primary block" href="#/lesson/${nx.id}/${resumeStep(nx.id)}">Go to lesson ${nx.n}: <span lang="de">${esc(nx.title)}</span></a>` : ''}
      <a class="btn quiet block" href="#/cards/session">Review words</a><a class="btn quiet block" href="#/">All lessons</a></div>
    <p class="muted small">Taking a break? Everything is saved. Continue brings you straight back.</p></section>`;
}
/* =====================================================================
   TASKS: gap · match · mc · translate · dictation
   ===================================================================== */
const MATCH = {}; // per-task state for matching: { order, sel, pairs }
const umlBar = () => `<div class="uml" role="group" aria-label="Special letters"><span>Type:</span>${['ä', 'ö', 'ü', 'ß'].map(c => `<button type="button" data-ins="${c}" aria-label="Insert ${c}">${c}</button>`).join('')}</div>`;
const inAttrs = `autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="de" enterkeyhint="next"`;

function taskHtml(task, lid, kind, ti) {
  const key = `${lid}-${kind}-${ti}`;
  let body = '';
  if (task.type === 'gap') body = task.items.map((it, i) => {
    const [a, b] = it.text.split('___');
    const w = Math.max(...it.answers.map(x => x.length), 3);
    return `<label class="gap-line"><span lang="de">${esc(a)}</span><input class="gap-in" data-i="${i}" style="--w:${w}" ${inAttrs} aria-label="Missing word"><span lang="de">${esc(b || '')}</span>`
      + `${it.en ? `<span class="gap-en">${esc(it.en)}</span>` : ''}${it.explain ? `<span class="explain" hidden>${esc(it.explain)}</span>` : ''}</label>`;
  }).join('');
  if (task.type === 'translate') body = task.items.map((it, i) => `<div class="tr-item"><p class="tr-prompt">${esc(it.prompt)}</p>
      <input class="txt-in" data-i="${i}" ${inAttrs} placeholder="Auf Deutsch …" aria-label="${esc(it.prompt)} in German">
      <div class="sol" hidden><b lang="de">${esc(it.answers[0])}</b>${sayBtns(it.answers[0])}</div></div>`).join('');
  if (task.type === 'dictation') body = task.items.map((it, i) => `<div class="dict-item"><div class="dict-top"><span class="dict-n">${i + 1}</span>${sayBtns(it.say)}${it.hint ? `<span class="muted small">${esc(it.hint)}</span>` : ''}</div>
      <input class="txt-in" data-i="${i}" ${inAttrs} aria-label="What you heard, sentence ${i + 1}">
      <div class="sol" hidden><span><b lang="de">${esc(it.show || it.say)}</b>${it.en ? `<br><span class="muted small">${esc(it.en)}</span>` : ''}</span></div></div>`).join('');
  if (task.type === 'mc') body = task.items.map((it, i) => `<div class="mc-item" data-i="${i}"><p class="mc-q">${esc(it.q)}</p>
      <div class="opts" role="group">${it.options.map((o, j) => `<button type="button" class="opt" data-act="opt" data-o="${j}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>
      ${it.explain ? `<span class="explain" hidden>${esc(it.explain)}</span>` : ''}</div>`).join('');
  if (task.type === 'match') body = `<div class="match-wrap">${matchHtml(task, key)}</div>`;
  const hasText = ['gap', 'translate', 'dictation'].includes(task.type);
  return `<article class="task" data-lid="${lid}" data-kind="${kind}" data-ti="${ti}">
    <div class="task-h">${kind === 'practice' ? `<span class="task-n">${ti + 1}</span>` : ''}<h3>${esc(task.instruction)}</h3></div>
    ${task.type === 'match' ? '<p class="muted small" style="margin-top:0">Tap a German word, then its English partner.</p>' : ''}
    ${body}${hasText ? umlBar() : ''}
    <p class="task-fb" aria-live="polite"></p>
    <div class="task-act"><button type="button" class="btn primary" data-act="check">Check</button><button type="button" class="btn quiet" data-act="show">Show answer</button></div></article>`;
}
function taskOf(el) {
  const l = LESSON(el.dataset.lid);
  return el.dataset.kind === 'listen' ? listenTask(l) : l.exercises[+el.dataset.ti];
}
function taskKey(el) { return `${el.dataset.lid}-${el.dataset.kind}-${el.dataset.ti}`; }

/* Match */
function matchState(task, key) {
  return MATCH[key] || (MATCH[key] = { order: shuffle(task.pairs.map((_, i) => i)), sel: null, pairs: {}, marks: null });
}
function matchHtml(task, key) {
  const st = matchState(task, key);
  const rightOwner = {}; Object.entries(st.pairs).forEach(([l, r]) => { rightOwner[r] = +l; });
  const cls = (side, i, owner) => {
    const c = ['mi'];
    if (side === 'L' && st.sel === i) c.push('sel');
    if (owner != null) { c.push('paired'); if (st.marks) c.push(st.marks[owner] ? 'ok' : 'bad'); }
    return c.join(' ');
  };
  const left = task.pairs.map((p, i) => {
    const paired = st.pairs[i] != null;
    return `<button type="button" class="${cls('L', i, paired ? i : null)}" style="--pc:var(--m${i % 6})" data-act="mleft" data-i="${i}" lang="de" aria-pressed="${st.sel === i}">${esc(p[0])}${paired ? `<span class="pb">${i + 1}</span>` : ''}</button>`;
  }).join('');
  const right = st.order.map(r => {
    const owner = rightOwner[r];
    return `<button type="button" class="${cls('R', r, owner)}" ${owner != null ? `style="--pc:var(--m${owner % 6})"` : ''} data-act="mright" data-r="${r}">${esc(task.pairs[r][1])}${owner != null ? `<span class="pb">${owner + 1}</span>` : ''}</button>`;
  }).join('');
  return `<div class="match"><div class="col">${left}</div><div class="col">${right}</div></div>`;
}
function rerenderMatch(el) { const task = taskOf(el); $('.match-wrap', el).innerHTML = matchHtml(task, taskKey(el)); }

/* Check */
function setFb(el, cls, text) { const fb = $('.task-fb', el); fb.className = 'task-fb ' + cls; fb.textContent = text; }
function summarize(el, ok, total, almost, empty) {
  if (ok === total) { setFb(el, 'ok', pickOne(['Sehr gut! All correct.', 'Perfekt! Everything is right.', 'Super, all correct!', 'Toll gemacht! All right.'])); return; }
  let t = `${ok} of ${total} correct.`;
  if (almost) t += ' Orange means almost: check the spelling.';
  if (empty) t += ` ${empty} still empty.`;
  if (total - ok - almost - empty > 0) t += ' Have another go at the red ones, or tap Show answer.';
  setFb(el, almost && ok + almost === total ? 'almost' : 'bad', t);
}
function checkTask(el) {
  const task = taskOf(el);
  let ok = 0, total = 0, almost = 0, empty = 0;
  if (['gap', 'translate', 'dictation'].includes(task.type)) {
    $$('input[data-i]', el).forEach(inp => {
      const it = task.items[+inp.dataset.i];
      const g = grade(inp.value, it.answers, !!it.compact);
      total++;
      inp.classList.remove('in-ok', 'in-bad', 'in-almost', 'in-shown');
      if (g === 'ok') { ok++; inp.classList.add('in-ok'); }
      else if (g === 'almost') { almost++; inp.classList.add('in-almost'); }
      else if (g === 'empty') empty++;
      else inp.classList.add('in-bad');
      const ex = inp.parentElement.querySelector('.explain'); if (ex && g === 'ok') ex.hidden = false;
    });
  } else if (task.type === 'mc') {
    $$('.mc-item', el).forEach((row, i) => {
      const it = task.items[i]; total++;
      $$('.opt', row).forEach(o => o.classList.remove('ok', 'bad'));
      const sel = $('.opt[aria-pressed="true"]', row);
      if (!sel) { empty++; return; }
      const right = +sel.dataset.o === it.answer;
      sel.classList.add(right ? 'ok' : 'bad');
      if (right) { ok++; const ex = $('.explain', row); if (ex) ex.hidden = false; }
    });
  } else if (task.type === 'match') {
    const st = matchState(task, taskKey(el));
    total = task.pairs.length;
    const paired = Object.keys(st.pairs).length;
    if (paired < total) { setFb(el, 'info', `Match all pairs first: ${total - paired} to go.`); return; }
    st.marks = {}; task.pairs.forEach((_, i) => { st.marks[i] = st.pairs[i] === i; if (st.marks[i]) ok++; });
    rerenderMatch(el);
  }
  summarize(el, ok, total, almost, empty);
}
function showTask(el) {
  const task = taskOf(el);
  if (task.type === 'gap') {
    $$('input[data-i]', el).forEach(inp => {
      const it = task.items[+inp.dataset.i];
      if (grade(inp.value, it.answers) !== 'ok') { inp.value = it.answers[0]; inp.classList.remove('in-ok', 'in-bad', 'in-almost'); inp.classList.add('in-shown'); }
      const ex = inp.parentElement.querySelector('.explain'); if (ex) ex.hidden = false;
    });
  } else if (task.type === 'translate' || task.type === 'dictation') {
    $$('.sol', el).forEach(s => { s.hidden = false; });
  } else if (task.type === 'mc') {
    $$('.mc-item', el).forEach((row, i) => {
      const it = task.items[i];
      $$('.opt', row).forEach(o => { o.classList.remove('ok', 'bad'); if (+o.dataset.o === it.answer) { o.classList.add('ok'); o.setAttribute('aria-pressed', 'true'); } else o.setAttribute('aria-pressed', 'false'); });
      const ex = $('.explain', row); if (ex) ex.hidden = false;
    });
  } else if (task.type === 'match') {
    const st = matchState(task, taskKey(el));
    st.sel = null; st.pairs = {}; st.marks = {};
    task.pairs.forEach((_, i) => { st.pairs[i] = i; st.marks[i] = true; });
    rerenderMatch(el);
  }
  setFb(el, 'info', task.type === 'dictation' ? 'Here is what was said. Play it again and read along.' : 'Here are the answers. Say each one out loud once.');
}

/* =====================================================================
   WORD BOX
   ===================================================================== */
function viewCards() {
  const ids = validCards();
  if (!ids.length) {
    const nx = nextLesson();
    main().innerHTML = `<h1>Word box</h1><p class="lead">Your word box is empty. Words land here as soon as you finish the Words step of a lesson.</p>
      ${nx ? `<a class="btn primary block" href="#/lesson/${nx.id}/${resumeStep(nx.id)}">Open lesson ${nx.n}</a>` : ''}`;
    return;
  }
  const counts = [1, 2, 3, 4, 5].map(b => ids.filter(id => S.cards[id].box === b).length);
  const max = Math.max(...counts, 1);
  const due = dueCount();
  const labs = ['every round', 'after 1 day', 'after 3 days', 'after 1 week', 'after 2 weeks'];
  main().innerHTML = `<h1>Word box</h1>
    <p class="lead">Every word starts in box 1. Get it right and it moves up a box and rests longer. Get it wrong and it goes back to box 1, so tricky words come up more often.</p>
    <div class="boxes" aria-hidden="true">${counts.map(c => `<div class="bx"><b>${c}</b><span class="bar" style="height:${Math.round(c / max * 100)}%"></span></div>`).join('')}</div>
    <div class="bx-labs">${labs.map((t, i) => `<span><b>Box ${i + 1}</b>${t}</span>`).join('')}</div>
    <p style="margin-top:1.25rem">${due ? `${due} of your ${ids.length} words are ready for review.` : `All ${ids.length} words are resting. You can still practise the ones in the lowest boxes.`}</p>
    <a class="btn primary block" href="#/cards/session">${due ? `Practise ${Math.min(due, 10)} words` : 'Practise anyway'}</a>`;
}
function buildSession() {
  const now = Date.now(), ids = validCards();
  const byBox = arr => shuffle(arr).sort((a, b) => S.cards[a].box - S.cards[b].box);
  let q = byBox(ids.filter(id => S.cards[id].due <= now)).slice(0, 10);
  if (q.length < 10) q = q.concat(byBox(ids.filter(id => !q.includes(id))).slice(0, 10 - q.length));
  return { queue: q, i: 0, state: 'ask', first: {}, seen: new Set(), requeued: new Set(), result: null, input: '' };
}
function gradeCard(w, input) {
  const g = grade(input, answersOf(w));
  if (g === 'ok' || g === 'empty') return g;
  if (w.art) {
    if (grade(input, [w.de]) === 'ok') return 'noart';
    if (['der', 'die', 'das'].some(a => a !== w.art && grade(input, [a + ' ' + w.de]) === 'ok')) return 'wrongart';
  }
  return g;
}
function moveCard(id, result, repeat) {
  const c = S.cards[id]; const now = Date.now();
  if (repeat) return;
  if (result === 'up') { c.box = Math.min(5, c.box + 1); c.r++; c.due = now + BOX_DAYS[c.box] * DAY; }
  else if (result === 'down') { c.box = 1; c.w++; c.due = now; }
  else { c.due = now; }
  save();
}
function viewSession(fresh) {
  document.body.classList.add('no-tabs');
  if (fresh || !UI.session) UI.session = buildSession();
  const s = UI.session;
  if (!s.queue.length) { go('cards'); return; }
  if (s.i >= s.queue.length) { sessionSummary(); return; }
  const id = s.queue[s.i], w = cardWord(id), c = S.cards[id];
  const pct = Math.round(s.i / s.queue.length * 100);
  let inner = `<p class="fc-meta">Box ${c.box}</p><p class="fc-prompt">${esc(w.cue || w.en)}</p>
    <p class="fc-hint">${w.art ? 'A noun: include der, die or das.' : 'Write it in German.'}</p>`;
  const ans = `<div class="fc-ans"><b lang="de">${w.art ? `<span class="g-${w.art}"><span class="art">${w.art}</span></span> ` : ''}${esc(w.de)}</b>${sayBtns(w.say || answerOf(w))}</div>${w.pl ? `<p class="muted small" lang="de">plural: ${esc(w.pl)}</p>` : ''}`;
  if (s.state === 'ask') {
    inner += `<input id="card-in" class="txt-in" ${inAttrs} enterkeyhint="done" placeholder="Auf Deutsch …" aria-label="Your answer in German" value="${esc(s.input)}">${umlBar()}
      <div class="task-act" style="margin-top:.9rem"><button class="btn primary" data-act="card-check">Check</button><button class="btn quiet" data-act="card-show">Show</button></div>`;
  } else if (s.state === 'result') {
    const r = s.result;
    const msg = {
      ok: ['ok', 'Richtig! ✓'],
      noart: ['almost', `The word is right, but it needs its article: ${answerOf(w)}.`],
      wrongart: ['bad', `Right word, wrong article. It's ${w.art}.`],
      almost: ['almost', 'So close. Just a small spelling slip.'],
      bad: ['bad', 'Not this time. Here it is:']
    }[r];
    inner += `<p class="muted small">You wrote: <span lang="de">${esc(s.input)}</span></p>${ans}<p class="fc-fb ${msg[0]}">${esc(msg[1])}</p>
      <div class="task-act" style="margin-top:.9rem"><button class="btn primary" data-act="card-next" id="card-next">Next</button></div>`;
  } else if (s.state === 'reveal') {
    inner += `${ans}<p class="fc-fb">Did you know it?</p>
      <div class="task-act" style="margin-top:.6rem"><button class="btn primary" data-act="card-rate" data-knew="1">Yes, I knew it</button><button class="btn quiet" data-act="card-rate" data-knew="0">Not yet</button></div>`;
  }
  main().innerHTML = `<div class="sess-top"><a class="back" href="#/cards" aria-label="End session">${IC.back}</a><div class="sess-bar"><i style="width:${pct}%"></i></div><span class="small muted">${s.i + 1} / ${s.queue.length}</span></div>
    <div class="fcard">${inner}</div>`;
  if (s.state === 'ask') { const inp = $('#card-in'); if (inp && window.matchMedia('(hover: hover)').matches) inp.focus(); }
  if (s.state === 'result') { const b = $('#card-next'); b && b.focus({ preventScroll: true }); }
}
function sessionAnswer(outcome) {
  const s = UI.session, id = s.queue[s.i];
  const repeat = s.seen.has(id);
  if (!repeat) s.first[id] = outcome === 'up';
  s.seen.add(id);
  moveCard(id, outcome, repeat);
  if (outcome !== 'up' && !s.requeued.has(id)) { s.requeued.add(id); s.queue.push(id); }
}
function sessionSummary() {
  const s = UI.session;
  const uniq = Object.keys(s.first).length, right = Object.values(s.first).filter(Boolean).length;
  main().innerHTML = `<p class="done-k" lang="de">Fertig!</p><h1>${right} of ${uniq} right first time.</h1>
    <p>${right === uniq ? 'Every word moved up a box. Wunderbar!' : 'The words you missed are back in box 1 and will come up again soon. That’s how they stick.'}</p>
    <div class="stack"><button class="btn primary block" data-act="card-again">Another round</button><a class="btn quiet block" href="#/cards">Word box</a><a class="btn quiet block" href="#/">Lessons</a></div>`;
}

/* =====================================================================
   MORE: false friends + settings
   ===================================================================== */
function viewMore() {
  const voices = TTS.voices;
  main().innerHTML = `<h1>More</h1>
    <h2>False friends</h2><p class="lead">German words that look English but mean something else. Great for a laugh, bad in a shop.</p>
    <div class="ffs">${FALSE_FRIENDS.map(f => ffCard(f).replace('</article>', f.lesson ? `<p class="ff-src">Comes up in lesson ${LESSON(f.lesson).n}</p></article>` : '</article>')).join('')}</div>
    <h2>Settings</h2>
    <div class="set"><label for="set-name">Your name</label><input id="set-name" class="txt-in" value="${esc(S.name)}" maxlength="30" autocomplete="given-name"></div>
    <div class="set"><label for="voice">German voice</label>
      <select id="voice" class="txt-in">${voices.length ? voices.map(v => `<option value="${esc(v.voiceURI)}" ${TTS.main() === v ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('') : '<option value="">No German voice found</option>'}</select>
      <p class="muted small">${voices.length ? 'Voices differ a lot between devices. Try a few and keep the clearest.' : 'Add a German voice in your phone’s text-to-speech settings, then reopen the app.'}</p>
      <label for="rate" style="margin-top:.75rem">Normal speed: <span id="rate-v">${Math.round((S.settings.rate || .95) * 100)}%</span></label>
      <input id="rate" type="range" min="0.7" max="1.1" step="0.05" value="${S.settings.rate || .95}">
      <button class="btn quiet" data-act="voice-test" style="margin-top:.5rem">${IC.speaker} Test voice</button></div>
    <div class="set"><label>Speaking practice</label><p class="muted small" style="margin:0">${Rec.ok ? 'Available. Tap a mic button and say the word. Recognition isn’t perfect, especially for single words, so trust your ears too.' : 'Not available in this browser. Chrome on Android and Safari on iPhone support it.'}</p></div>
    <div class="set"><label>Your progress</label><p class="muted small" style="margin:0 0 .6rem">${Sync.status === 'synced' ? 'Saved on this device and synced to your Claude account.' : 'Saved in this browser on this device.'}</p>
      <button class="btn quiet danger" data-act="reset">Reset all progress</button></div>
    <div class="set"><label>How it works</label><p class="muted small" style="margin:0">Each lesson has five short steps and takes 10 to 15 minutes. Lessons build on each other, but you can open any of them at any time. There's no schedule: Continue always jumps to your next open step, however long the break.</p></div>`;
}
function refreshVoiceSelect() { if (UI.view === 'more') viewMore(); }

/* =====================================================================
   EVENTS
   ===================================================================== */
let lastInput = null, insHandled = false;
function insertChar(ch) {
  const inp = lastInput && document.body.contains(lastInput) ? lastInput : null;
  if (!inp) { toast('Tap into an answer field first, then add the letter.'); return; }
  const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, a) + ch + inp.value.slice(b);
  inp.focus();
  try { inp.setSelectionRange(a + ch.length, a + ch.length); } catch (e) { }
  inp.dispatchEvent(new Event('input', { bubbles: true }));
}

const ACTIONS = {
  'next-step'() {
    const lid = UI.lid, step = UI.step;
    completeStep(lid, step);
    const nk = nextOpenStep(lid, step);
    go(`lesson/${lid}/${nk || 'done'}`);
  },
  check(t) { checkTask(t.closest('.task')); },
  show(t) { showTask(t.closest('.task')); },
  opt(t) {
    const row = t.closest('.mc-item');
    $$('.opt', row).forEach(o => { o.setAttribute('aria-pressed', String(o === t)); o.classList.remove('ok', 'bad'); });
  },
  mleft(t) {
    const el = t.closest('.task'), task = taskOf(el), st = matchState(task, taskKey(el)), i = +t.dataset.i;
    st.marks = null;
    if (st.pairs[i] != null) { delete st.pairs[i]; st.sel = i; }
    else st.sel = st.sel === i ? null : i;
    rerenderMatch(el);
  },
  mright(t) {
    const el = t.closest('.task'), task = taskOf(el), st = matchState(task, taskKey(el)), r = +t.dataset.r;
    st.marks = null;
    const owner = Object.keys(st.pairs).find(k => st.pairs[k] === r);
    if (st.sel != null) { if (owner != null) delete st.pairs[owner]; st.pairs[st.sel] = r; st.sel = null; }
    else if (owner != null) delete st.pairs[owner];
    else { const f = $('.task-fb', el); f.className = 'task-fb info'; f.textContent = 'Tap a German word first.'; return; }
    rerenderMatch(el);
  },
  'dlg-play'(t) {
    const l = LESSON(UI.lid); const stop = $('[data-act="dlg-stop"]');
    if (stop) stop.hidden = false;
    TTS.dialog(l.listening.lines, {
      slow: t.dataset.slow === '1',
      onLine: i => { $$('.dl').forEach(d => d.classList.toggle('speaking', +d.dataset.li === i)); },
      onDone: onDialogEnd
    });
  },
  'dlg-stop'() { TTS.stop(); },
  'toggle-tr'(t) {
    const d = $('.dlg'); d.hidden = !d.hidden;
    t.setAttribute('aria-expanded', String(!d.hidden));
    t.textContent = d.hidden ? 'Show transcript' : 'Hide transcript';
  },
  'rand-hear'() { TTS.speak(numWord(UI.rand)); },
  'rand-show'() { const w = $('#rnw'); if (w) w.hidden = false; TTS.speak(numWord(UI.rand)); },
  'rand-new'() { newRandomNumber(); },
  'skip-name'() { UI.nameSkipped = true; route(); },
  'dismiss-back'() { UI.backDismissed = true; route(); },
  'card-check'() {
    const s = UI.session, inp = $('#card-in'); if (!s || !inp) return;
    const w = cardWord(s.queue[s.i]); const r = gradeCard(w, inp.value);
    if (r === 'empty') { toast('Type your answer first, or tap Show.'); return; }
    s.input = inp.value; s.result = r; s.state = 'result';
    sessionAnswer(r === 'ok' ? 'up' : (r === 'noart' || r === 'almost') ? 'stay' : 'down');
    viewSession(false);
    TTS.speak(w.say || answerOf(w));
  },
  'card-show'() {
    const s = UI.session; if (!s) return;
    s.input = ''; s.state = 'reveal'; viewSession(false);
    const w = cardWord(s.queue[s.i]); TTS.speak(w.say || answerOf(w));
  },
  'card-rate'(t) { sessionAnswer(t.dataset.knew === '1' ? 'up' : 'down'); ACTIONS['card-next'](); },
  'card-next'() { const s = UI.session; s.i++; s.state = 'ask'; s.input = ''; s.result = null; viewSession(false); window.scrollTo(0, 0); },
  'card-again'() { UI.session = buildSession(); viewSession(false); },
  'voice-test'() { TTS.speak('Hallo! Ich bin deine Stimme für Deutsch.'); },
  reset(t) {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete everything'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Reset all progress'; } }, 4000); return; }
    const keep = { settings: S.settings, name: S.name };
    S = freshState(); S.settings = keep.settings; S.name = keep.name; save();
    Object.keys(MATCH).forEach(k => delete MATCH[k]);
    toast('All progress has been reset.'); go('');
  }
};

/* ä ö ü ß buttons: insert on press so the text field keeps focus (and the phone keyboard stays open) */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-ins]');
  if (b) { e.preventDefault(); insHandled = true; setTimeout(() => { insHandled = false; }, 600); insertChar(b.dataset.ins); }
});
document.addEventListener('mousedown', e => { if (e.target.closest('[data-ins]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-say],[data-rec],[data-act],[data-ins],.toast-x');
  if (!t) return;
  if (t.matches('.toast-x')) { hideToast(); return; }
  if (t.dataset.ins) { if (insHandled) insHandled = false; else insertChar(t.dataset.ins); return; }
  if (t.dataset.say !== undefined) { TTS.speak(t.dataset.say, { slow: t.dataset.slow === '1' }); return; }
  if (t.dataset.rec !== undefined) { Rec.listen(t.dataset.rec, t); return; }
  const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.gap-in, input.txt-in')) lastInput = e.target; });
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('.gap-in, .task .txt-in')) e.target.classList.remove('in-ok', 'in-bad', 'in-almost', 'in-shown');
  if (e.target.id === 'card-in' && UI.session) UI.session.input = e.target.value;
  if (e.target.id === 'rate') { S.settings.rate = +e.target.value; const v = $('#rate-v'); if (v) v.textContent = Math.round(S.settings.rate * 100) + '%'; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'voice' && e.target.value) { S.settings.voice = e.target.value; save(); TTS.speak('Hallo!'); }
  if (e.target.id === 'rate') { save(); TTS.speak('Das ist die normale Geschwindigkeit.'); }
  if (e.target.id === 'set-name') { S.name = e.target.value.trim().slice(0, 30); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches) return;
  if (e.target.id === 'card-in') { e.preventDefault(); ACTIONS['card-check'](); return; }
  if (!e.target.matches('.task input')) return;
  e.preventDefault();
  const task = e.target.closest('.task'), inputs = $$('input[data-i]', task), i = inputs.indexOf(e.target);
  if (i < inputs.length - 1) inputs[i + 1].focus(); else checkTask(task);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'name-form') return;
  e.preventDefault();
  const v = $('#nm').value.trim().slice(0, 30);
  if (!v) { toast('Type your name after „Ich heiße“.'); return; }
  S.name = v; save(); route();
  toast(`<span lang="de"><b>Hallo, ${esc(v)}! Freut mich.</b></span> (Nice to meet you.)`, { kind: 'ok' });
  TTS.speak(`Hallo ${v}! Freut mich.`);
});
window.addEventListener('hashchange', route);

/* =====================================================================
   START
   ===================================================================== */
(function start() {
  const now = Date.now();
  UI.daysAway = S.lastVisit ? Math.floor((now - S.lastVisit) / DAY) : 0;
  S.lastVisit = now; saveLocal(); // a visit alone isn't a progress change
  TTS.init();
  route();
  Sync.init();
})();
</script>
